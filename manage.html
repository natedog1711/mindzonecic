<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" type="image/png" href="/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage your booking — MindZone</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241a35; --dusk:#3a2c58; --mist:#f3eef8; --paper:#fbf8fc;
    --teal:#3fb0ac; --teal-deep:#2c8e8f; --violet:#6c5b9e; --rose:#e97c93;
    --line: rgba(36,26,53,0.12); --max: 560px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Sora', sans-serif; color:var(--ink); background:var(--paper); line-height:1.6; }
  .wrap{max-width:var(--max); margin:0 auto; padding:50px 24px 100px;}
  h1{
    font-family:'Fraunces', serif; font-weight:500; font-style:italic;
    font-size:clamp(1.6rem, 4vw, 2rem); margin-bottom:6px; color:var(--dusk);
  }
  p.lede{color:#544a68; font-weight:300; margin-bottom:28px;}
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px; margin-bottom:24px; }
  .detail-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:0.92rem; }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row .label{ color:#786d94; }
  .detail-row .value{ font-weight:600; }
  button, .btn{
    font-family:'Sora'; font-weight:600; font-size:0.9rem; cursor:pointer;
    border:none; border-radius:100px; padding:11px 22px;
    background:linear-gradient(120deg, var(--teal), var(--violet)); color:#fff;
    display:inline-block; text-align:center;
  }
  button.danger{ background:var(--rose); }
  button.ghost{ background:transparent; border:1px solid var(--line); color:var(--dusk); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .banner{ padding:14px 18px; border-radius:12px; margin-bottom:24px; font-size:0.9rem; font-weight:500; }
  .banner.warn{ background:#fdf3e3; color:#8a5f1f; border:1px solid #f0d090; }
  .banner.error{ background:#fdeef1; color:#a5445a; border:1px solid var(--rose); }
  .banner.success{ background:#e3f6f2; color:var(--teal-deep); border:1px solid var(--teal); }
  .reschedule-list{ display:none; margin-top:18px; }
  .day-group{ margin-bottom:16px; }
  .day-group h3{ font-family:'Fraunces', serif; font-weight:500; font-size:0.95rem; margin-bottom:8px; }
  .slots{ display:flex; flex-wrap:wrap; gap:8px; }
  .slot-btn{
    border:1px solid var(--line); border-radius:100px; padding:8px 16px;
    font-family:'Sora'; font-size:0.85rem; font-weight:600; cursor:pointer; background:#fff; color:var(--dusk);
  }
  .slot-btn:hover{ background:var(--mist); }
  .policy{ font-size:0.82rem; color:#786d94; margin-top:20px; }
  .empty{ color:#786d94; font-size:0.9rem; }
</style>
</head>
<body>

<div class="wrap">
  <h1>Manage your booking</h1>
  <p class="lede">Reschedule or cancel below — free of charge up to 48 hours before your session.</p>

  <div id="banner"></div>
  <div id="content"><p class="empty">Loading your booking…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://mpxyfbpxyzcorujgsotn.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1weHlmYnB4eXpjb3J1amdzb3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjgzOTYsImV4cCI6MjEwMTEwNDM5Nn0.3PnfLluxYcbgcWQ75sGbt89uOB51AEDddMH-AHYY0Ds";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  function formatDate(d){
    return new Date(d + "T00:00:00").toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  }

  async function callManage(action, extra = {}){
    const res = await fetch(`${SUPABASE_URL}/functions/v1/manage-booking`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ token, action, ...extra })
    });
    const data = await res.json();
    return { ok: res.ok, data };
  }

  function showBanner(type, message){
    document.getElementById('banner').innerHTML = `<div class="banner ${type}">${message}</div>`;
  }

  async function init(){
    const content = document.getElementById('content');
    if (!token) {
      content.innerHTML = `<p class="empty">This link looks incomplete — please use the link from your confirmation email.</p>`;
      return;
    }

    const { ok, data } = await callManage('lookup');
    if (!ok) {
      content.innerHTML = '';
      showBanner('error', data.error || "We couldn't find that booking.");
      return;
    }

    render(data);
  }

  function render(booking){
    const content = document.getElementById('content');

    content.innerHTML = `
      <div class="card">
        <div class="detail-row"><span class="label">Name</span><span class="value">${booking.client_name || '—'}</span></div>
        <div class="detail-row"><span class="label">Session</span><span class="value">${booking.session_type}</span></div>
        <div class="detail-row"><span class="label">Date</span><span class="value">${formatDate(booking.slot_date)}</span></div>
        <div class="detail-row"><span class="label">Time</span><span class="value">${booking.slot_time.slice(0,5)}</span></div>
        <div class="detail-row"><span class="label">Format</span><span class="value">${booking.session_format === 'online' ? 'Online' : 'In person'}</span></div>

        ${booking.can_change ? `
          <div class="actions">
            <button class="ghost" id="showRescheduleBtn">Reschedule</button>
            <button class="danger" id="cancelBtn">Cancel booking</button>
          </div>
          <div class="reschedule-list" id="rescheduleList"></div>
        ` : `
          <p class="policy" style="margin-top:16px;">
            This session is less than 48 hours away, so it can't be changed online.
            Please <a href="https://wa.me/447734456367" target="_blank" rel="noopener noreferrer">message us on WhatsApp</a> directly.
          </p>
        `}
      </div>
      <p class="policy">Cancellations or reschedules made at least 48 hours before your session are free, with any payment refunded automatically. Changes within 48 hours need to go through us directly.</p>
    `;

    if (booking.can_change) {
      document.getElementById('cancelBtn').addEventListener('click', () => doCancel());
      document.getElementById('showRescheduleBtn').addEventListener('click', () => loadRescheduleOptions());
    }
  }

  async function doCancel(){
    if (!confirm('Cancel this session? Any payment will be refunded automatically.')) return;
    const btn = document.getElementById('cancelBtn');
    btn.disabled = true;
    btn.textContent = 'Cancelling…';

    const { ok, data } = await callManage('cancel');
    if (!ok) {
      showBanner('error', data.error || 'Something went wrong.');
      btn.disabled = false;
      btn.textContent = 'Cancel booking';
      return;
    }
    document.getElementById('content').innerHTML = '';
    showBanner('success', 'Your session has been cancelled and refunded. We hope to see you again soon.');
  }

  async function loadRescheduleOptions(){
    const list = document.getElementById('rescheduleList');
    list.style.display = 'block';
    list.innerHTML = `<p class="empty">Loading available times…</p>`;

    const { data, error } = await db
      .from('public_slots')
      .select('*')
      .eq('status', 'available')
      .gte('slot_date', new Date().toISOString().slice(0,10))
      .order('slot_date').order('slot_time');

    if (error || !data.length) {
      list.innerHTML = `<p class="empty">No other times are open right now — please try again later or contact us.</p>`;
      return;
    }

    const byDate = {};
    data.forEach(s => { (byDate[s.slot_date] ||= []).push(s); });

    list.innerHTML = Object.entries(byDate).slice(0, 10).map(([date, slots]) => `
      <div class="day-group">
        <h3>${formatDate(date)}</h3>
        <div class="slots">
          ${slots.map(s => `<button class="slot-btn" data-id="${s.id}">${s.slot_time.slice(0,5)}</button>`).join('')}
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.slot-btn').forEach(btn => {
      btn.addEventListener('click', () => doReschedule(btn.dataset.id, btn));
    });
  }

  async function doReschedule(newSlotId, btn){
    btn.disabled = true;
    btn.textContent = 'Moving…';

    const { ok, data } = await callManage('reschedule', { new_slot_id: newSlotId });
    if (!ok) {
      showBanner('error', data.error || 'Something went wrong.');
      btn.disabled = false;
      btn.textContent = 'Try again';
      return;
    }
    document.getElementById('content').innerHTML = '';
    showBanner('success', `Done — your session has moved to ${formatDate(data.new_date)} at ${data.new_time.slice(0,5)}.`);
  }

  init();
</script>
</body>
</html>
