<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" type="image/png" href="/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form — MindZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241a35; --dusk:#3a2c58; --violet:#6c5b9e; --paper:#fbf8fc; --line: rgba(36,26,53,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Sora', sans-serif; color:var(--ink); background:var(--paper); line-height:1.6; }
  .wrap{max-width:760px; margin:0 auto; padding:50px 24px 0;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--violet);
    text-decoration:none; font-size:0.88rem; font-weight:600; margin-bottom:20px;
  }
  .back-link:hover{ text-decoration:underline; }
  h1{
    font-family:'Fraunces', serif; font-weight:500; font-style:italic;
    font-size:clamp(1.6rem, 4vw, 2.1rem); margin-bottom:8px; color:var(--dusk);
  }
  p.desc{ color:#544a68; margin-bottom:24px; }
  iframe{ width:100%; min-height:80vh; border:none; border-radius:14px; }
  .empty{ color:#786d94; padding:60px 24px; text-align:center; }
</style>
</head>
<body>

<div class="wrap">
  <a href="/" class="back-link">&larr; Back to homepage</a>
  <div id="content"><p class="empty">Loading…</p></div>
</div>

<script>
  const SUPABASE_URL = "https://mpxyfbpxyzcorujgsotn.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1weHlmYnB4eXpjb3J1amdzb3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjgzOTYsImV4cCI6MjEwMTEwNDM5Nn0.3PnfLluxYcbgcWQ75sGbt89uOB51AEDddMH-AHYY0Ds";

  async function load(){
    const content = document.getElementById('content');
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/site_settings?key=in.(custom_form_title,custom_form_description,custom_form_url)`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
      });
      const rows = await res.json();
      const settings = {};
      (rows || []).forEach(r => settings[r.key] = r.value);

      const title = settings.custom_form_title || 'Get in touch';
      const description = settings.custom_form_description || '';
      const url = settings.custom_form_url || '';

      if (!url) {
        content.innerHTML = `<p class="empty">There's no form here right now — check back soon.</p>`;
        return;
      }

      content.innerHTML = `
        <h1>${title}</h1>
        ${description ? `<p class="desc">${description}</p>` : ''}
        <iframe src="${url}" title="${title}"></iframe>
      `;
      document.title = `${title} — MindZone`;
    } catch (err) {
      console.error(err);
      content.innerHTML = `<p class="empty">Couldn't load the form right now — please try again shortly.</p>`;
    }
  }

  load();
</script>

          'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1weHlmYnB4eXpjb3J1amdzb3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjgzOTYsImV4cCI6MjEwMTEwNDM5Nn0.3PnfLluxYcbgcWQ75sGbt89uOB51AEDddMH-AHYY0Ds',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ path: window.location.pathname })
      }).catch(function(){});
    } catch(e) {}
  })();
</script>
</body>
</html>
